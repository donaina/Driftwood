<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-react</title>

  <body>
    <div id="root"></div>
    <!--
      The dev server's entry point. There is no single app root to mount: each
      view is its own entry, built separately into web/dist, and web/index.html
      loads them all. This file pointed at src/main.tsx, which has never
      existed, so `npm run dev` served a 404 on the one file it needs. Point it
      at whichever view you are working on — the list of entries is
      rollupOptions.input in vite.config.ts.
    -->
    <script type="module" src="/src/main-history.tsx"></script>
  </body>
</html>
