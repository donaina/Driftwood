<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The brand mark, drawn the same way the header draws it: a "D" on
       --accent-primary in --on-accent.

       Byte-for-byte the same file as frontend-react/public/favicon.svg, and
       deliberately duplicated rather than shared: the two builds have separate
       public/ roots and neither can import the other's, so the alternative is a
       copy step in the Makefile. Two small files that must match is the cheaper
       of those, and the mismatch it risks — an app and a site with different
       icons in adjacent tabs — is exactly the thing this is here to prevent.

       The light accent is used, not the dark one, because a favicon is a single
       file with no theme to respond to. #1a6fd4 is the default theme's value. -->
  <rect width="32" height="32" rx="7" fill="#1a6fd4"/>
  <text x="16" y="22.5" font-family="Geist, -apple-system, system-ui, sans-serif"
        font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">D</text>
</svg>
