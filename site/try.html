<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Try Driftwood — drive a real breaking change</title>
  <meta name="description"
    content="Point Driftwood at its own simulator, break the response contract on purpose, and watch the breaking change arrive as real traffic with the exact field that changed.">
  <meta name="color-scheme" content="light dark">

  <!-- Same pre-paint resolution as the landing page; see the note there. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('driftwood-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) { /* storage unavailable: fall through to the OS preference */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/try/main.tsx"></script>
</body>

</html>
