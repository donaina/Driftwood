name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/drift-linux-amd64 cmd/drift/main.go
          GOOS=linux GOARCH=arm64 go build -o dist/drift-linux-arm64 cmd/drift/main.go
          GOOS=darwin GOARCH=amd64 go build -o dist/drift-darwin-amd64 cmd/drift/main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/drift-darwin-arm64 cmd/drift/main.go
          GOOS=windows GOARCH=amd64 go build -o dist/drift-windows-amd64.exe cmd/drift/main.go

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}