name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/apidiff-linux-amd64 cmd/apidiff/main.go
          GOOS=linux GOARCH=arm64 go build -o dist/apidiff-linux-arm64 cmd/apidiff/main.go
          GOOS=darwin GOARCH=amd64 go build -o dist/apidiff-darwin-amd64 cmd/apidiff/main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/apidiff-darwin-arm64 cmd/apidiff/main.go
          GOOS=windows GOARCH=amd64 go build -o dist/apidiff-windows-amd64.exe cmd/apidiff/main.go

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
