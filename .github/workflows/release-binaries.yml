name: Release Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      # No default. This was `v1.0.0` — a tag that already means something else
      # on this repository, so a manual run would have created a release on it
      # and attached binaries that are not what that tag points at. A dispatch
      # now has to name the tag it is releasing.
      tag_name:
        description: 'Tag to release, which must already exist (e.g. v1.0.6)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend-react/package-lock.json
            site/package-lock.json

      # Before Go, not after. web/web.go embeds web/dist and site/site.go embeds
      # site/dist, so //go:embed fails the build outright when either has not
      # been built — which means every one of the five builds below depends on
      # this step. It was missing entirely, and then it built the dashboard and
      # not the site: site/dist is gitignored apart from PLACEHOLDER, and a
      # runner starts from a clean checkout, so there was nothing else there to
      # embed and the release shipped a /try with no stylesheet and no scripts.
      # That case compiles and starts, so it is asserted here rather than left
      # to the startup warning site.AssetsBuilt raises.
      - name: Build the embedded assets
        run: |
          npm --prefix frontend-react ci
          npm --prefix frontend-react run build
          test -f web/dist/assets/driftwood.css
          npm --prefix site ci
          npm --prefix site run build
          test -f site/dist/index.html
          test -f site/dist/try.html

      # The list has to equal the names bin/install.js constructs, and nothing
      # checked that. windows/arm64 was the gap: getBinaryName() maps win32+arm64
      # to drift-windows-arm64.exe, so a Windows on ARM machine asked for an
      # asset this step never built, got a 404, and fell back to a Go toolchain
      # it may not have. The five originals were all reachable; this one was
      # reachable and absent, which a dry run cannot see because it never
      # resolves an asset URL.
      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/drift-linux-amd64 ./cmd/drift
          GOOS=linux GOARCH=arm64 go build -o dist/drift-linux-arm64 ./cmd/drift
          GOOS=darwin GOARCH=amd64 go build -o dist/drift-darwin-amd64 ./cmd/drift
          GOOS=darwin GOARCH=arm64 go build -o dist/drift-darwin-arm64 ./cmd/drift
          GOOS=windows GOARCH=amd64 go build -o dist/drift-windows-amd64.exe ./cmd/drift
          GOOS=windows GOARCH=arm64 go build -o dist/drift-windows-arm64.exe ./cmd/drift

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
